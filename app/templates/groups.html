{% extends 'base.html' %}{% block title %}用户组管理{% endblock %}{% block content %}<h1>用户组管理</h1><section class="card"><h2>创建用户组</h2><form method="post" action="/admin/groups"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="row"><label>名称<input name="name" required maxlength="100"></label><label>说明<input name="description" maxlength="500"></label></div><fieldset><legend>组成员</legend>{% for u in users %}<label class="check"><input type="checkbox" name="member_ids" value="{{ u.id }}">{{ u.display_name or u.username }}</label>{% endfor %}</fieldset><button class="primary">创建用户组</button></form></section>{% for group in groups %}<section class="card"><form method="post" action="/admin/groups/{{ group.id }}/edit"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="row"><label>名称<input name="name" value="{{ group.name }}" required></label><label>说明<input name="description" value="{{ group.description }}"></label></div><fieldset><legend>成员</legend>{% for u in users %}<label class="check"><input type="checkbox" name="member_ids" value="{{ u.id }}" {{ 'checked' if u in group.users else '' }}>{{ u.display_name or u.username }}</label>{% endfor %}</fieldset><button>保存用户组</button></form><form method="post" action="/admin/groups/{{ group.id }}/delete" onsubmit="return confirm('删除该用户组？')"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="danger">删除用户组</button></form></section>{% else %}<p class="muted">尚未创建用户组。</p>{% endfor %}{% endblock %}
