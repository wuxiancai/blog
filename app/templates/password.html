{% extends 'base.html' %}{% block title %}修改密码{% endblock %}{% block content %}<section class="auth card"><div class="eyebrow">账号安全</div><h1>设置新密码</h1><p>至少 9 个字符，且大写、小写、数字、特殊符号至少包含三类。</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>新密码<input type="password" name="new_password" required minlength="9" autocomplete="new-password"></label><button class="primary">保存密码</button></form></section>{% endblock %}
