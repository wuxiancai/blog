{% extends 'base.html' %}
{% block title %}创建图集 · 私有博客{% endblock %}
{% block content %}
<a class="back" href="/gallery">← 返回图集</a><h1>创建图集</h1>
<form method="post" action="/gallery/new" class="card gallery-form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>图集名称<input name="title" required maxlength="240" placeholder="例如：周末徒步"></label>
  <label>简介<textarea name="description" rows="3" maxlength="2000" placeholder="写一点图集说明（可选）"></textarea></label>
  <section class="access-picker"><h2>可见范围</h2><p class="muted">默认所有登录用户可浏览；选择用户或用户组后，仅所选对象、创建者和管理员可见。</p>
    <div class="reader-picker" aria-label="选择用户和用户组">
      <div class="reader-group"><h3>用户</h3><div class="reader-options">
        {% for u in users %}<button type="button" class="reader-option" data-reader-value="user:{{ u.id }}" aria-pressed="false">{{ u.display_name or u.username }}<small>{{ u.username }}</small></button>{% endfor %}
      </div></div>
      <div class="reader-group"><h3>用户组</h3><div class="reader-options">
        {% for group in groups %}<button type="button" class="reader-option" data-reader-value="group:{{ group.id }}" aria-pressed="false">{{ group.name }}<small>{{ group.users|length }} 人</small></button>{% endfor %}
      </div></div>
    </div>
  </section>
  <button class="primary" type="submit">创建并上传图片</button>
</form>
<script defer src="/static/access-picker.js?v={{ asset_version }}"></script>
{% endblock %}
