{% extends 'base.html' %}{% block title %}个人设置{% endblock %}{% block content %}<a class="back" href="/articles">← 返回文章</a><section class="card auth"><div class="eyebrow">账号资料</div><h1>个人设置</h1><p class="muted">{{ user.username }} · {{ '管理员' if user.role == 'admin' else '普通用户' }}</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>显示名称<input name="display_name" maxlength="120" value="{{ user.display_name }}"></label><label>通知邮箱<input name="email" type="email" maxlength="320" value="{{ user.email }}" placeholder="用于接收与你分享的定时文章通知"></label><p class="muted">配置邮件服务后，文章作者定时发布面向你的文章时会发送邮件。</p><button class="primary">保存资料</button></form><hr><h2>修改密码</h2><p>密码至少 9 位，且大写、小写、数字、特殊符号至少包含三类。</p><a class="button" href="/change-password">前往修改密码</a></section>{% endblock %}
